{% extends 'admin/admin_base.html' %}

{% block title %}Projetos | Administração{% endblock %}

{% block css_extra %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/admin/leads.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/admin/clientes.css') }}">
{% endblock %}

{% block content %}
<div class="barra-topo">
    <input type="search" id="busca" placeholder="Pesquisar por nome, serviço ou escopo" aria-label="Pesquisar projetos">
    <button type="button" class="botao" id="botao-novo">+ novo projeto</button>
</div>

<p id="aviso" role="status"></p>

<table class="tabela-admin">
    <thead>
        <tr>
            <th>ID</th><th>Nome</th><th>Cliente</th><th>Categoria</th>
            <th>Status</th><th>Prioridade</th><th>Prazo de entrega</th><th>Detalhes</th>
        </tr>
    </thead>
    <tbody id="corpo-projetos"></tbody>
</table>

<dialog id="dialogo-novo">
    <form id="form-novo" class="form-dialogo">
        <h2>Novo projeto</h2>
        <label>Nome <input name="nome" maxlength="150" required></label>
        <label>Cliente <select name="cliente_id" required></select></label>
        <label>Categoria <select name="categoria_id" required></select></label>
        <label>Serviço (opcional) <select name="servico"></select></label>
        <label>Prioridade (opcional) <select name="prioridade_id"></select></label>
        <label>Prazo de entrega (opcional) <input type="date" name="data_entrega"></label>
        <p class="erro-dialogo" role="alert"></p>
        <div class="acoes-dialogo">
            <button type="button" class="botao botao-secundario" data-fechar>Cancelar</button>
            <button type="submit" class="botao">Criar</button>
        </div>
    </form>
</dialog>
{% endblock %}

{% block js_extra %}
<script src="{{ url_for('static', filename='js/admin/projetos.js') }}"></script>
{% endblock %}
