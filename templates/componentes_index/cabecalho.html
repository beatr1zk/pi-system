<header class="cabecalho">
    <a class="marca" href="#inicio" aria-label="Voltar para o início">
        <img class="logo" src="{{ url_for('static', filename='img/logo.svg') }}" alt="Logo de Beatriz Kava">
    </a>

    <nav class="navegacao" id="navegacao" aria-label="Navegação principal">
        <ul class="lista-navegacao">
            <li><a href="#inicio">Home</a></li> 
            <li><a href="#sobre">Quem sou</a></li>
            <li><a href="#projetos">Projetos</a></li>
            <li><a href="#contato">Contato</a></li>
        </ul>
    </nav>

    <a class="botao botao-contato" href="#contato">Vamos conversar</a>

    <button class="botao-menu" type="button" aria-label="Abrir menu" aria-expanded="false" aria-controls="navegacao">
        <span></span>
        <span></span>
        <span></span>
    </button>
</header>

<script>
    (function () {
        var cabecalho = document.querySelector('.cabecalho');
        var botao = cabecalho.querySelector('.botao-menu');

        function alternar(aberto) {
            cabecalho.classList.toggle('menu-aberto', aberto);
            botao.setAttribute('aria-expanded', aberto);
            botao.setAttribute('aria-label', aberto ? 'Fechar menu' : 'Abrir menu');
        }

        botao.addEventListener('click', function () {
            alternar(!cabecalho.classList.contains('menu-aberto'));
        });

        cabecalho.querySelectorAll('.navegacao a, .botao-contato').forEach(function (link) {
            link.addEventListener('click', function () { alternar(false); });
        });

        document.addEventListener('keydown', function (evento) {
            if (evento.key === 'Escape') alternar(false);
        });
    })();
</script>
